name: CI

# Every pull request (and every push to it) gets the quick checks: formatting, types, lint, unit
# tests, the build, and the backend integration tests against a real database.
#
# The slow ones (the browser suite and the production image build + boot test) run on every
# merge to main and every night, so main is always proven shippable. On a pull request they run
# only when it carries the `e2e` label, for changes that touch access, keys or the image.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Format, types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install
        run: |
          pnpm -C backend install --frozen-lockfile
          pnpm -C backend run generate
          pnpm -C frontend install --frozen-lockfile

      - name: Versions agree
        run: pnpm run check:versions

      - name: Format
        run: pnpm run format:check

      - name: Types
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Frontend build
        run: pnpm -C frontend run build

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      storage:
        image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadminpassword
          RUSTFS_ADDRESS: 0.0.0.0:9000
        ports:
          - 9000:9000
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: |
          pnpm -C backend install --frozen-lockfile
          pnpm -C backend run generate

      - run: pnpm -C backend run test:integration

  e2e:
    name: Browser tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm -C frontend install --frozen-lockfile

      - name: Start the stack
        # The stack refuses to start without a signing secret, so this run gets a throwaway one
        # (kept for the later steps, which also read the compose file). Apart from that, with no
        # .env it starts with the dev login on and request limits off, which is what the specs
        # need (frontend/e2e/README.md).
        run: |
          secret="$(openssl rand -hex 32)"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          AUTH_SECRET="$secret" docker compose up -d --build db storage backend frontend

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 \
              && curl -fsS http://localhost:5173 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail 80
          exit 1

      - run: pnpm -C frontend exec playwright install --with-deps chromium

      - run: pnpm run test:e2e

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Production image
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - run: |
          pnpm -C backend install --frozen-lockfile
          pnpm -C backend run generate
          pnpm -C frontend install --frozen-lockfile

      - name: Build and static-serving checks
        run: npm run test:prod-container

      - name: Build the image
        run: docker build -t canvhq:ci .

      - name: Boot the image through its entrypoint
        run: scripts/smoke-test-image.sh canvhq:ci
