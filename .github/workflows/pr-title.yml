name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit message on main, and the release
# notes and the next version number are built from those messages. It has to read like one:
# `feat: ...` (a new version), `fix: ...` (a patch), `perf:` and `revert:` (a patch), or
# `chore:`, `build:`, `ci:` for maintenance (a patch, listed under "Maintenance"), or `docs:`,
# `test:`, `refactor:`, `style:` (not part of the notes). The sections live in
# release-please-config.json.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title reads like a commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
