name: Pull request title

# Pull requests are squash-merged, so the title becomes the commit message on main, and the release
# notes and the next version number are built from those messages. It has to read like one:
# `feat: ...` (a new version), `fix: ...` (a patch), or `docs:`, `chore:`, `ci:`, `test:`,
# `refactor:`, `perf:`, `build:`, `style:`, `revert:` (not part of the notes).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Title reads like a commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
