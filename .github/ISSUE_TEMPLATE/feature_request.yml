name: Feature request
description: Suggest something CanvHQ should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the need, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. Keep in mind that canvases are end-to-end encrypted, so the server cannot read them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Any workaround or other tool you use instead.
