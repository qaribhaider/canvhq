name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the app, for example v0.1.0. Say "main" if you built it yourself.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How you run it
      options:
        - Docker Compose (production file)
        - Coolify
        - Local development stack
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      description: For example Chrome 130 on macOS.
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: From the browser console or the server. Remove anything private first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you send
      options:
        - label: This is not a security problem (those go to the private report linked on the new-issue page).
          required: true
        - label: I removed passwords, keys and personal details from what I pasted.
          required: true
