allowBuilds: {}

# Patched releases of packages Excalidraw and its Mermaid converter depend on (advisories for
# nanoid, lodash and katex). Drop these when those packages depend on the patched versions.
overrides:
  'nanoid@<4': '^3.3.20'
  'nanoid@>=4': '^5.1.16'
  lodash-es: '>=4.18.1'
  katex: '>=0.18.2'
publicHoistPattern:
  - '*roughjs*'
