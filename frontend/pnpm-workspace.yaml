allowBuilds: {}

# Patched releases of packages Excalidraw and its Mermaid converter depend on (advisories for
# nanoid, lodash, katex and the transitive dev packages of the shadcn CLI). Drop these when those packages depend on the patched versions.
overrides:
  'nanoid@<4': '^3.3.20'
  'nanoid@>=4': '^5.1.16'
  lodash-es: '>=4.18.1'
  katex: '>=0.18.2'
  body-parser: '>=2.4.0'
  fast-uri: '>=3.1.9'
  systeminformation: '>=5.33.16'
  'postcss-selector-parser@<6.1.5': '^6.1.5'
  'minimatch@>=7 <11': '^11.0.1'
publicHoistPattern:
  - '*roughjs*'
