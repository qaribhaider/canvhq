allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@scarf/scarf': false

# Patched releases of two transitive packages with denial-of-service advisories (express's body
# parser and multer). Drop these when @nestjs/platform-express depends on the patched versions.
overrides:
  body-parser: '>=2.4.0'
  multer: '>=2.5.0'
  undici: '>=6.29.1'
  tmp: '>=0.2.6'
  fast-uri: '>=3.1.9'
  'minimatch@>=7 <11': '^11.0.1'

peerDependencyRules:
  allowedVersions:
    nestjs-zod>@nestjs/common: '12'
    nestjs-zod>@nestjs/swagger: '12'
    tsconfck>typescript: '6'
